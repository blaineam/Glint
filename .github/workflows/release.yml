name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # cut-release dispatches this at the tag ref

permissions:
  contents: write

jobs:
  build:
    name: Build, Sign & Notarize
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4


      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Generate brand assets
        run: swift Scripts/generate-assets.swift build/assets

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Build release
        run: |
          IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          xcodebuild -scheme Glint \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            build

      - name: Package DMG
        run: |
          APP_PATH=$(find build/DerivedData -name "Glint.app" -type d | head -1)
          IDENTITY=$(security find-identity -v -p codesigning $RUNNER_TEMP/build.keychain-db | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')

          mkdir -p dist
          hdiutil create -volname "Glint" -fs HFS+ -size 50m build/glint-temp.dmg -quiet
          ATTACH_OUT=$(hdiutil attach -readwrite -noverify build/glint-temp.dmg)
          DEVICE=$(echo "$ATTACH_OUT" | head -1 | awk '{print $1}')

          cp -R "$APP_PATH" "/Volumes/Glint/"
          ln -s /Applications "/Volumes/Glint/Applications" 2>/dev/null || true

          if [ -f "build/assets/dmg-background.jpg" ]; then
            mkdir -p "/Volumes/Glint/.background"
            cp build/assets/dmg-background.jpg "/Volumes/Glint/.background/background.jpg"
          fi

          sleep 2

          osascript <<EOF || true
          tell application "Finder"
            tell disk "Glint"
              open
              delay 2
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set bounds of container window to {200, 200, 860, 600}
              set viewOptions to icon view options of container window
              set icon size of viewOptions to 100
              try
                set background picture of viewOptions to file ".background:background.jpg"
              end try
              try
                set position of item "Glint.app" of container window to {145, 185}
              end try
              try
                set position of item "Applications" of container window to {515, 185}
              end try
              close
              delay 1
            end tell
          end tell
          EOF

          sleep 2
          hdiutil detach "$DEVICE" -force 2>/dev/null || true
          sleep 1
          hdiutil convert build/glint-temp.dmg -format UDZO -imagekey zlib-level=9 -o dist/Glint.dmg -quiet
          codesign --force --sign "$IDENTITY" --timestamp dist/Glint.dmg

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          SUBMIT_OUT=$(xcrun notarytool submit dist/Glint.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait 2>&1)
          echo "$SUBMIT_OUT"

          # Extract submission ID and fetch log on failure
          SUB_ID=$(echo "$SUBMIT_OUT" | grep "id:" | head -1 | awk '{print $NF}')
          STATUS=$(echo "$SUBMIT_OUT" | grep "status:" | tail -1 | awk '{print $NF}')

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            echo "--- Fetching notarization log ---"
            xcrun notarytool log "$SUB_ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" || true
            exit 1
          fi

          xcrun stapler staple dist/Glint.dmg

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Glint ${{ steps.version.outputs.version }}
          body: |
            ## ✨ Glint ${{ steps.version.outputs.version }}

            DDC display control from your keyboard. Tiny, invisible, always ready.

            ### Install on Mac
            1. Download `Glint.dmg` below
            2. Open the DMG and drag Glint to Applications
            3. Launch Glint and grant Accessibility access when prompted

            **Notarized by Apple** — safe to run on any Mac.

            ### Install on Windows 10/11 (no admin needed)
            1. Download `Glint-windows-x64.exe` (most PCs) or `Glint-windows-arm64.exe` (Snapdragon/ARM PCs) below
            2. Put it anywhere you like, e.g. `%LOCALAPPDATA%\Programs\Glint`, and run it
            3. The exe isn't code-signed yet, so SmartScreen may warn: choose **More info → Run anyway**

            Glint lives in the tray. Brightness: your keyboard's brightness keys, or **Ctrl+Alt+Page Up / Page Down** (changeable in the tray menu). Click the tray icon for sliders, right-click for settings. Volume keys drive your monitor's speakers when Windows plays through it.

            ---
            _See [CHANGELOG](../../blob/main/CHANGELOG.md) for details._
          files: dist/Glint.dmg
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') }}

  windows:
    name: Windows build
    # After the Mac job so the GitHub Release already exists; this only attaches assets.
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build x64 + ARM64
        run: |
          export GLINT_VERSION="${GITHUB_REF_NAME#v}"
          cargo build --release --locked --target x86_64-pc-windows-msvc
          cargo build --release --locked --target aarch64-pc-windows-msvc
          mkdir -p ../dist
          cp target/x86_64-pc-windows-msvc/release/Glint.exe ../dist/Glint-windows-x64.exe
          cp target/aarch64-pc-windows-msvc/release/Glint.exe ../dist/Glint-windows-arm64.exe
          (cd ../dist && sha256sum Glint-windows-*.exe > Glint-windows-SHA256SUMS.txt && cat Glint-windows-SHA256SUMS.txt)

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            ../dist/Glint-windows-x64.exe ../dist/Glint-windows-arm64.exe ../dist/Glint-windows-SHA256SUMS.txt \
            --clobber --repo "$GITHUB_REPOSITORY"

  linux:
    name: Linux build
    # After the Mac job so the GitHub Release already exists; this only attaches assets.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf

      - name: Build tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm

      - name: Zig (cross linker)
        run: pip install ziglang

      - name: Test
        run: |
          (cd core && cargo test)
          (cd linux && cargo test --locked)

      - name: Build and package
        working-directory: linux
        run: |
          set -e
          export GLINT_VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ../dist
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl armv7-unknown-linux-musleabihf; do
            cargo zigbuild --release --locked --target "$t"
            cargo deb --no-build --no-strip --target "$t" --output ../dist/
            cargo generate-rpm --target "$t" --output ../dist/
            arch=$(echo "$t" | cut -d- -f1)
            stage=$(mktemp -d)/glint-linux-$arch
            mkdir -p "$stage"
            cp "target/$t/release/glint" packaging/install.sh packaging/glint.service packaging/glint.desktop res/glint.png ../LICENSE "$stage/"
            tar -C "$(dirname "$stage")" -czf "../dist/glint-linux-$arch.tar.gz" "glint-linux-$arch"
          done
          (cd ../dist && sha256sum * > Glint-linux-SHA256SUMS.txt && cat Glint-linux-SHA256SUMS.txt)

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
