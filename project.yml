name: Glint
options:
  bundleIdPrefix: com.blainemiller
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "16.3"
  minimumXcodeGenVersion: "2.38.0"
  # In-app localization: en is the development language; translations live in
  # Glint/Resources/Localizable.xcstrings.
  developmentLanguage: en

settings:
  base:
    # APPLE SILICON ONLY. Apple (2026-09): universal Mac App Store apps that
    # require macOS 13+ may drop Intel, and macOS 27 runs only on Apple silicon.
    # Scoped to macosx so iOS/watchOS arch resolution (incl. arm64_32 on older
    # watches) is untouched — a bare `ARCHS: arm64` would break those.
    ARCHS[sdk=macosx*]: arm64
    EXCLUDED_ARCHS[sdk=macosx*]: x86_64
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    # Emit .stringsdata for every compiled file so `xcodebuild
    # -exportLocalizations` can see string literals in SwiftUI views.
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  # Shared feedback / rating / "other apps" kit (Libraries/MillerKit).
  MillerKit:
    url: https://github.com/blaineam/MillerKit
    from: "1.2.2"   # structural funding-link gate (store/TF builds hide it; direct keeps it)

targets:
  Glint:
    type: application
    platform: macOS
    sources:
      - Glint/Sources
      - Glint/Resources/Assets.xcassets
      - Glint/Resources/Glint.icon
      - Glint/Resources/Localizable.xcstrings
    info:
      path: Glint/Resources/Info.plist
      properties:
        CFBundleName: Glint
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "1.5.1"
        CFBundleVersion: "22"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Blaine Miller. MIT License."
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: Glint/Resources/Glint.entitlements
      properties:
        com.apple.security.app-sandbox: false
    scheme:
      testTargets:
        - GlintTests
      gatherCoverageData: true
    dependencies:
      - package: MillerKit
      - sdk: IOKit.framework
      - sdk: CoreAudio.framework
    settings:
      base:
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.Glint
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        SWIFT_OBJC_BRIDGING_HEADER: Glint/Sources/App/Glint-Bridging-Header.h
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: Glint
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Debug builds (Xcode runs, the hosted unit tests, GlintUITests) get their own
        # bundle ID, so a test launch never collides with — or gets terminated as — the
        # installed Glint, and never writes the real com.blainemiller.Glint defaults
        # (status-item position etc.). Release keeps com.blainemiller.Glint.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.Glint.debug

  # Unit tests, hosted in Glint.app (so @testable import sees the app module).
  # AppDelegate returns early under XCTest, so a test run never installs the
  # media-key event tap or shows the Accessibility alert.
  GlintTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GlintTests
    dependencies:
      - target: Glint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.GlintTests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        # XCTest itself requires macOS 14; the app keeps its macOS 13 floor.
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Glint.app/Contents/MacOS/Glint
        BUNDLE_LOADER: $(TEST_HOST)

  # UI tests (XCUITest) driving Glint.app in its DEBUG-only -UITestMode (see
  # Glint/Sources/App/UITestMode.swift): fixture monitors, stubbed Accessibility,
  # throwaway defaults suite, no event tap, recorded (not opened) URLs.
  # Run through the GlintUITests scheme, kept out of the Glint scheme so the unit
  # suite stays fast.
  GlintUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - GlintUITests
    dependencies:
      - target: Glint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blainemiller.GlintUITests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_TARGET_NAME: Glint

schemes:
  GlintUITests:
    build:
      targets:
        Glint: all
        GlintUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Glint
      targets:
        - GlintUITests
